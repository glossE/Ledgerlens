version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ledgerlens-db
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: